<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Registration Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  font-family: 'Montserrat', sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  overflow: hidden;
}

/* ─── WIDGET SHELL ─── */
#ggGroupNudge {
  width: 100%;
  background: #fff;
  border: 1.5px solid rgba(0,40,85,.12);
  border-left: 4px solid #002855;
  border-radius: 12px;
  overflow: hidden;
}

/* ─── MAIN STRIP ─── */
#gnMain {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
}

.gnLabel {
  flex-shrink: 0;
}

.gnTag {
  font-size: .57rem;
  font-weight: 700;
  letter-spacing: .09em;
  color: rgba(0,40,85,.45);
  text-transform: uppercase;
  margin-bottom: 3px;
}

.gnHeadline {
  font-size: .82rem;
  font-weight: 700;
  color: #002855;
  white-space: nowrap;
  line-height: 1.25;
}

.gnSub {
  font-size: .63rem;
  font-weight: 500;
  color: rgba(0,40,85,.42);
  margin-top: 2px;
  white-space: nowrap;
}

/* ─── SLIDER ZONE ─── */
.gnSliderZone {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.gnSliderRow {
  display: flex;
  align-items: center;
  gap: 9px;
}

.gnPeoplePill {
  flex-shrink: 0;
  background: #002855;
  color: #fff;
  font-size: .63rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
  min-width: 70px;
  text-align: center;
}

#gnSlider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(0,40,85,.13);
  outline: none;
  cursor: pointer;
  accent-color: #002855;
}

#gnSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #002855;
  box-shadow: 0 2px 6px rgba(0,40,85,.22);
  cursor: pointer;
}

#gnSlider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #002855;
  box-shadow: 0 2px 6px rgba(0,40,85,.22);
  cursor: pointer;
  border: none;
}

.gnSliderEnd {
  flex-shrink: 0;
  font-size: .6rem;
  font-weight: 600;
  color: rgba(0,40,85,.32);
}

/* ─── RESULT ROW ─── */
.gnResultRow {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 2px;
}

.gnResultStrike {
  font-size: .68rem;
  font-weight: 600;
  color: rgba(0,40,85,.3);
  text-decoration: line-through;
  white-space: nowrap;
}

.gnResultMeta {
  font-size: .6rem;
  font-weight: 500;
  color: rgba(0,40,85,.32);
  white-space: nowrap;
}

.gnArrow {
  font-size: .78rem;
  color: rgba(0,40,85,.22);
  flex-shrink: 0;
}

.gnResultGroup {
  font-size: .68rem;
  font-weight: 700;
  color: #002855;
  white-space: nowrap;
}

.gnSavings {
  font-size: .65rem;
  font-weight: 700;
  color: rgba(0,40,85,.55);
  white-space: nowrap;
  background: rgba(0,40,85,.07);
  padding: 2px 8px;
  border-radius: 999px;
}

/* ─── CONTACT BUTTON ─── */
.gnContactBtn {
  flex-shrink: 0;
  border: 1.5px solid rgba(0,40,85,.2);
  background: #fff;
  color: #002855;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: .73rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
  line-height: 1.3;
  text-align: center;
}

.gnContactBtn:hover {
  background: #002855;
  color: #fff;
  border-color: #002855;
  box-shadow: 0 4px 14px rgba(0,40,85,.2);
}

/* ─── FORM VIEW ─── */
#gnFormView {
  display: none;
  border-top: 1px solid rgba(0,40,85,.08);
  padding: 12px 16px 14px;
  animation: gnFadeIn .2s ease;
}

@keyframes gnFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.gnFormHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}

.gnFormTitle {
  font-size: .78rem;
  font-weight: 700;
  color: #002855;
}

.gnClose {
  border: none;
  background: none;
  color: rgba(0,40,85,.35);
  font-size: .82rem;
  cursor: pointer;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s ease;
  padding: 0;
  flex-shrink: 0;
}

.gnClose:hover {
  background: #002855;
  color: #fff;
}

.gnFormFields {
  display: flex;
  gap: 7px;
  align-items: stretch;
  flex-wrap: wrap;
}

.gnFormFields input,
.gnFormFields textarea {
  font-size: .78rem;
  font-weight: 500;
  color: #002855;
  border: 1.5px solid rgba(0,40,85,.14);
  border-radius: 8px;
  padding: 7px 10px;
  outline: none;
  background: #fff;
  transition: border-color .15s ease, box-shadow .15s ease;
  line-height: 1.4;
}

.gnFormFields input::placeholder,
.gnFormFields textarea::placeholder {
  color: rgba(0,40,85,.3);
}

.gnFormFields input:focus,
.gnFormFields textarea:focus {
  border-color: #002855;
  box-shadow: 0 0 0 3px rgba(0,40,85,.1);
}

.gnFormFields input.gnError,
.gnFormFields textarea.gnError {
  border-color: #b04239;
}

#gnName    { flex: 0 1 148px; min-width: 110px; }
#gnEmail   { flex: 0 1 185px; min-width: 130px; }
#gnMsg     { flex: 1 1 160px; min-width: 140px; resize: none; height: 34px; }

.gnSendBtn {
  flex-shrink: 0;
  border: none;
  background: #002855;
  color: #fff;
  padding: 0 18px;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: .18s ease;
  height: 34px;
}

.gnSendBtn:hover:not(:disabled) {
  background: #003d80;
  box-shadow: 0 4px 12px rgba(0,40,85,.25);
}

.gnSendBtn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* ─── SUCCESS ─── */
#gnSuccess {
  display: none;
  font-size: .76rem;
  font-weight: 600;
  color: rgba(0,40,85,.6);
  padding: 4px 0 0;
  text-align: left;
  animation: gnFadeIn .25s ease;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 580px) {
  #gnMain { flex-wrap: wrap; gap: 10px; }
  .gnLabel { flex: 0 0 100%; }
  .gnContactBtn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<div id="ggGroupNudge">

  <!-- MAIN STRIP -->
  <div id="gnMain">

    <div class="gnLabel">
      <div class="gnTag">Group Savings</div>
      <div class="gnHeadline">10+ attendees = up to 49% off</div>
      <div class="gnSub">$175 individual · rates drop with group size</div>
    </div>

    <div class="gnSliderZone">
      <div class="gnSliderRow">
        <span class="gnPeoplePill" id="gnPeoplePill">10 people</span>
        <input type="range" id="gnSlider" min="10" max="60" value="10" aria-label="Group size">
        <span class="gnSliderEnd">60</span>
      </div>
      <div class="gnResultRow">
        <span class="gnResultStrike" id="gnIndivTotal">$1,750</span>
        <span class="gnResultMeta">individually</span>
        <span class="gnArrow">→</span>
        <span class="gnResultGroup" id="gnGroupTotal">$1,500 as a group</span>
        <span class="gnSavings" id="gnSavings">save $250</span>
      </div>
    </div>

    <button class="gnContactBtn" id="gnContactBtn">
      Send a message to the<br>Global Gathering team
    </button>

  </div>

  <!-- FORM VIEW -->
  <div id="gnFormView">
    <div class="gnFormHeader">
      <span class="gnFormTitle">Send a message to the Global Gathering team</span>
      <button class="gnClose" id="gnClose" aria-label="Close">✕</button>
    </div>
    <div class="gnFormFields" id="gnFormFields">
      <input type="text"  id="gnName"  placeholder="Your name"    autocomplete="name">
      <input type="email" id="gnEmail" placeholder="Your email"   autocomplete="email">
      <textarea id="gnMsg" placeholder="Your question or message" rows="1"></textarea>
      <button class="gnSendBtn" id="gnSend">Send →</button>
    </div>
    <div id="gnSuccess">
      ✓ Message sent! The Global Gathering team will be in touch soon.
    </div>
  </div>

</div>

<script>
(function () {
  const INDIV = 175;

  function groupRate(n) {
    if (n >= 50) return 90;
    if (n >= 40) return 105;
    if (n >= 30) return 120;
    if (n >= 20) return 135;
    return 150;
  }

  function fmt(n) {
    return '$' + n.toLocaleString('en-US');
  }

  const slider      = document.getElementById('gnSlider');
  const peoplePill  = document.getElementById('gnPeoplePill');
  const indivEl     = document.getElementById('gnIndivTotal');
  const groupEl     = document.getElementById('gnGroupTotal');
  const savingsEl   = document.getElementById('gnSavings');

  function update() {
    const n    = +slider.value;
    const rate = groupRate(n);
    const ind  = n * INDIV;
    const grp  = n * rate;
    const save = ind - grp;

    peoplePill.textContent = n + ' people';
    indivEl.textContent    = fmt(ind);
    groupEl.textContent    = fmt(grp) + ' as a group';
    savingsEl.textContent  = 'save ' + fmt(save);
  }

  slider.addEventListener('input', update);
  update();

  // ── Height reporting for iframe ──────────────────────
  function reportHeight() {
    const h = document.getElementById('ggGroupNudge').offsetHeight;
    window.parent.postMessage({ ggWidgetHeight: h + 2 }, '*');
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.getElementById('ggGroupNudge'));
  }
  window.addEventListener('load', reportHeight);

  // ── Contact form toggle ──────────────────────────────
  const contactBtn = document.getElementById('gnContactBtn');
  const formView   = document.getElementById('gnFormView');
  const closeBtn   = document.getElementById('gnClose');
  const formFields = document.getElementById('gnFormFields');
  const successMsg = document.getElementById('gnSuccess');

  function openForm() {
    formView.style.display = 'block';
    contactBtn.style.display = 'none';
    reportHeight();
    document.getElementById('gnName').focus();
  }

  function closeForm() {
    formView.style.display = 'none';
    contactBtn.style.display = '';
    successMsg.style.display = 'none';
    formFields.style.display = 'flex';
    document.getElementById('gnName').value  = '';
    document.getElementById('gnEmail').value = '';
    document.getElementById('gnMsg').value   = '';
    const btn = document.getElementById('gnSend');
    btn.disabled    = false;
    btn.textContent = 'Send →';
    reportHeight();
  }

  contactBtn.addEventListener('click', openForm);
  closeBtn.addEventListener('click', closeForm);

  // ── Send ─────────────────────────────────────────────
  document.getElementById('gnSend').addEventListener('click', async function () {
    const nameEl  = document.getElementById('gnName');
    const emailEl = document.getElementById('gnEmail');
    const msgEl   = document.getElementById('gnMsg');

    let valid = true;
    [nameEl, emailEl, msgEl].forEach(el => {
      if (!el.value.trim()) {
        el.classList.add('gnError');
        el.addEventListener('input', () => el.classList.remove('gnError'), { once: true });
        valid = false;
      }
    });
    if (!valid) return;

    this.disabled    = true;
    this.textContent = 'Sending…';

    try {
      const res = await fetch('https://formsubmit.co/ajax/globalgathering@cuanschutz.edu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          name:     nameEl.value.trim(),
          email:    emailEl.value.trim(),
          message:  msgEl.value.trim(),
          _subject: 'Group Registration Question — Global Gathering',
          _template: 'box'
        })
      });

      if (!res.ok) throw new Error();

      formFields.style.display = 'none';
      successMsg.style.display = 'block';
      reportHeight();
    } catch (_) {
      this.disabled    = false;
      this.textContent = 'Send →';
      alert('Something went wrong — please email globalgathering@cuanschutz.edu directly.');
    }
  });
})();
</script>
</body>
</html>
