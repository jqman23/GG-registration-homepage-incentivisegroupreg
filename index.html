<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Registration Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  font-family: 'Montserrat', sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  overflow: hidden;
}

#ggGroupNudge {
  width: 100%;
  background: #fff;
}

/* ─── MAIN STRIP ─── */
#gnMain {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 0;
}

.gnLabel {
  flex-shrink: 0;
}

.gnTag {
  font-size: 1.05rem;
  font-weight: 600;
  color: #111;
  margin-bottom: 4px;
  line-height: 1.25;
}

.gnHeadline {
  font-size: .82rem;
  font-weight: 400;
  color: rgba(0,0,0,.42);
  white-space: nowrap;
  line-height: 1.25;
  margin-top: 3px;
}

/* ─── SLIDER ZONE ─── */
.gnSliderZone {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.gnSliderRow {
  display: flex;
  align-items: center;
  gap: 9px;
}

.gnPeoplePill {
  flex-shrink: 0;
  background: rgba(0,0,0,.07);
  color: #111;
  font-size: .8rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 4px;
  white-space: nowrap;
  min-width: 76px;
  text-align: center;
}

#gnSlider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(0,0,0,.13);
  outline: none;
  cursor: pointer;
  accent-color: #111;
}

#gnSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #111;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  cursor: pointer;
}

#gnSlider::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid #111;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  cursor: pointer;
}

.gnSliderEnd {
  flex-shrink: 0;
  font-size: .78rem;
  font-weight: 600;
  color: rgba(0,0,0,.3);
}

/* ─── RESULT ROW ─── */
.gnResultRow {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.gnResultStrike {
  font-size: .88rem;
  font-weight: 500;
  color: rgba(0,0,0,.3);
  text-decoration: line-through;
  white-space: nowrap;
}

.gnResultMeta {
  font-size: .82rem;
  font-weight: 400;
  color: rgba(0,0,0,.35);
  white-space: nowrap;
}

.gnArrow {
  font-size: .88rem;
  color: rgba(0,0,0,.2);
  flex-shrink: 0;
}

.gnResultGroup {
  font-size: .88rem;
  font-weight: 600;
  color: #111;
  white-space: nowrap;
}

.gnSavings {
  font-size: .82rem;
  font-weight: 600;
  color: rgba(0,0,0,.42);
  white-space: nowrap;
}

/* ─── CONTACT BUTTON ─── */
.gnContactBtn {
  flex-shrink: 0;
  border: 1.5px solid rgba(0,0,0,.2);
  background: #fff;
  color: #111;
  padding: 8px 16px;
  border-radius: 4px;
  font-size: .9rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .18s ease, border-color .18s ease;
}

.gnContactBtn:hover {
  background: #111;
  color: #fff;
  border-color: #111;
}

/* ─── FORM VIEW ─── */
#gnFormView {
  display: none;
  border-top: 1px solid rgba(0,0,0,.08);
  padding: 10px 0 12px;
  animation: gnFadeIn .2s ease;
}

@keyframes gnFadeIn {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: translateY(0); }
}

.gnFormHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.gnFormTitle {
  font-size: .95rem;
  font-weight: 600;
  color: #111;
}

.gnClose {
  border: none;
  background: none;
  color: rgba(0,0,0,.35);
  font-size: .82rem;
  cursor: pointer;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s ease;
  padding: 0;
  flex-shrink: 0;
}

.gnClose:hover {
  background: #111;
  color: #fff;
}

.gnFormFields {
  display: flex;
  gap: 7px;
  align-items: stretch;
  flex-wrap: wrap;
}

.gnFormFields input,
.gnFormFields textarea {
  font-size: .9rem;
  font-weight: 400;
  color: #111;
  border: 1.5px solid rgba(0,0,0,.15);
  border-radius: 8px;
  padding: 8px 11px;
  outline: none;
  background: #fff;
  transition: border-color .15s ease, box-shadow .15s ease;
  line-height: 1.4;
}

.gnFormFields input::placeholder,
.gnFormFields textarea::placeholder {
  color: rgba(0,0,0,.28);
}

.gnFormFields input:focus,
.gnFormFields textarea:focus {
  border-color: #111;
  box-shadow: 0 0 0 3px rgba(0,0,0,.08);
}

.gnFormFields input.gnError,
.gnFormFields textarea.gnError {
  border-color: #888;
}

#gnName    { flex: 0 1 148px; min-width: 110px; }
#gnEmail   { flex: 0 1 185px; min-width: 130px; }
#gnMsg     { flex: 1 1 160px; min-width: 140px; resize: none; height: 38px; }

.gnSendBtn {
  flex-shrink: 0;
  border: none;
  background: #111;
  color: #fff;
  padding: 0 20px;
  border-radius: 4px;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: .18s ease;
  height: 38px;
}

.gnSendBtn:hover:not(:disabled) {
  background: #333;
}

.gnSendBtn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* ─── SUCCESS ─── */
#gnSuccess {
  display: none;
  font-size: .9rem;
  font-weight: 500;
  color: rgba(0,0,0,.5);
  padding: 5px 0 0;
  text-align: left;
  animation: gnFadeIn .25s ease;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 580px) {
  #gnMain { flex-wrap: wrap; gap: 10px; }
  .gnLabel { flex: 0 0 100%; }
  .gnContactBtn { width: 100%; text-align: center; }
}
</style>
</head>
<body>
<div id="ggGroupNudge">

  <!-- MAIN STRIP -->
  <div id="gnMain">

    <div class="gnLabel">
      <div class="gnTag">Explore Pricing for<br>Group Registrations</div>
      <div class="gnHeadline">14–49% savings</div>
    </div>

    <div class="gnSliderZone">
      <div class="gnSliderRow">
        <span class="gnPeoplePill" id="gnPeoplePill">10 people</span>
        <input type="range" id="gnSlider" min="10" max="100" value="10" aria-label="Group size">
        <span class="gnSliderEnd">100</span>
      </div>
      <div class="gnResultRow">
        <span class="gnResultStrike" id="gnIndivTotal">$1,750</span>
        <span class="gnResultMeta">without group discount</span>
        <span class="gnArrow">→</span>
        <span class="gnResultGroup" id="gnGroupTotal">$1,350 total for group</span>
        <span class="gnSavings" id="gnSavings">save $400 (23%)</span>
      </div>
    </div>

    <button class="gnContactBtn" id="gnContactBtn">Questions? Let us know.</button>

  </div>

  <!-- FORM VIEW -->
  <div id="gnFormView">
    <div class="gnFormHeader">
      <span class="gnFormTitle">Send a message to the Global Gathering team</span>
      <button class="gnClose" id="gnClose" aria-label="Close">✕</button>
    </div>
    <div class="gnFormFields" id="gnFormFields">
      <input type="text"  id="gnName"  placeholder="Your name"    autocomplete="name">
      <input type="email" id="gnEmail" placeholder="Your email"   autocomplete="email">
      <textarea id="gnMsg" placeholder="Your question or message" rows="1"></textarea>
      <button class="gnSendBtn" id="gnSend">Send →</button>
    </div>
    <div id="gnSuccess">
      ✓ Message sent! The Global Gathering team will be in touch soon.
    </div>
  </div>

</div>

<script>
(function () {
  // ── Click tracking (once per session) ───────────────
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxq8HofSFbnFxS7HeKQKZVhyuPIqpu_7NAWhvOzAXBzyxfatdeJu8hfGCRCahOINshA/exec';
  const TRACK_KEY  = 'ggNudgeTracked';

  async function trackClick() {
    if (sessionStorage.getItem(TRACK_KEY)) return;
    sessionStorage.setItem(TRACK_KEY, '1');

    const params = new URLSearchParams({
      sheet:  '2026Registration',
      button: 'RegHomePageGroupRegIncentivise'
    });

    // Try client-side geo with a 3s timeout — if it fails, Apps Script does its own lookup
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3000);
      const geo = await fetch('https://ipapi.co/json/', { signal: ctrl.signal }).then(r => r.json());
      clearTimeout(timer);
      if (geo.ip)           params.set('ip',      geo.ip);
      if (geo.country_name) params.set('country', geo.country_name);
      if (geo.region)       params.set('state',   geo.region);
      if (geo.city)         params.set('city',    geo.city);
    } catch (_) {}

    // Always fires — geo is nice-to-have but never blocks this
    fetch(SCRIPT_URL + '?' + params.toString(), { mode: 'no-cors' }).catch(() => {});
  }

  document.getElementById('ggGroupNudge').addEventListener('pointerdown', trackClick, { once: true });

  const INDIV = 175;

  const EARLY_BIRD = 0.90;

  function groupRate(n) {
    if (n >= 50) return 90;
    if (n >= 40) return 105;
    if (n >= 30) return 120;
    if (n >= 20) return 135;
    return 150;
  }

  function fmt(n) {
    return '$' + n.toLocaleString('en-US');
  }

  const slider     = document.getElementById('gnSlider');
  const peoplePill = document.getElementById('gnPeoplePill');
  const indivEl    = document.getElementById('gnIndivTotal');
  const groupEl    = document.getElementById('gnGroupTotal');
  const savingsEl  = document.getElementById('gnSavings');

  function update() {
    const n    = +slider.value;
    const rate = groupRate(n);
    const ind  = n * INDIV;
    const grp = Math.round(n * rate * EARLY_BIRD);
    const save = ind - grp;
    const pct  = Math.round((save / ind) * 100);

    peoplePill.textContent = n + ' people';
    indivEl.textContent    = fmt(ind);
    groupEl.textContent    = fmt(grp) + ' total for group';
    savingsEl.textContent  = 'save ' + fmt(save) + ' (' + pct + '%)';
  }

  slider.addEventListener('input', update);
  update();

  // ── Height reporting for iframe ──────────────────────
  function reportHeight() {
    const h = document.getElementById('ggGroupNudge').offsetHeight;
    window.parent.postMessage({ ggWidgetHeight: h + 2 }, '*');
  }

  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.getElementById('ggGroupNudge'));
  }
  window.addEventListener('load', reportHeight);

  // ── Form toggle ──────────────────────────────────────
  const contactBtn = document.getElementById('gnContactBtn');
  const formView   = document.getElementById('gnFormView');
  const closeBtn   = document.getElementById('gnClose');
  const formFields = document.getElementById('gnFormFields');
  const successMsg = document.getElementById('gnSuccess');

  function openForm() {
    formView.style.display = 'block';
    contactBtn.style.display = 'none';
    reportHeight();
    document.getElementById('gnName').focus();
  }

  function closeForm() {
    formView.style.display = 'none';
    contactBtn.style.display = '';
    successMsg.style.display = 'none';
    formFields.style.display = 'flex';
    document.getElementById('gnName').value  = '';
    document.getElementById('gnEmail').value = '';
    document.getElementById('gnMsg').value   = '';
    const btn = document.getElementById('gnSend');
    btn.disabled    = false;
    btn.textContent = 'Send →';
    reportHeight();
  }

  contactBtn.addEventListener('click', openForm);
  closeBtn.addEventListener('click', closeForm);

  // ── Send ─────────────────────────────────────────────
  document.getElementById('gnSend').addEventListener('click', async function () {
    const nameEl  = document.getElementById('gnName');
    const emailEl = document.getElementById('gnEmail');
    const msgEl   = document.getElementById('gnMsg');

    let valid = true;
    [nameEl, emailEl, msgEl].forEach(el => {
      if (!el.value.trim()) {
        el.classList.add('gnError');
        el.addEventListener('input', () => el.classList.remove('gnError'), { once: true });
        valid = false;
      }
    });
    if (!valid) return;

    this.disabled    = true;
    this.textContent = 'Sending…';

    try {
      const res = await fetch('https://formsubmit.co/ajax/globalgathering@cuanschutz.edu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          name:      nameEl.value.trim(),
          email:     emailEl.value.trim(),
          message:   msgEl.value.trim(),
          _subject:  'Group Registration Question — Global Gathering',
          _template: 'box'
        })
      });

      if (!res.ok) throw new Error();

      formFields.style.display = 'none';
      successMsg.style.display = 'block';
      reportHeight();
    } catch (_) {
      this.disabled    = false;
      this.textContent = 'Send →';
      alert('Something went wrong — please email globalgathering@cuanschutz.edu directly.');
    }
  });
})();
</script>
</body>
</html>
